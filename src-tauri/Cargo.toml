[package]
name = "esfera_v3"
version = "0.1.0"
description = "Esfera v3 — Plataforma de Disparos e Automação ADB"
authors = ["vicenzzopalma"]
edition = "2021"
default-run = "esfera_v3"

[lib]
name = "esfera_v3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "esfera-hub"
path = "src/bin/hub.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.0"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }
axum = "0.7"
uuid = { version = "1", features = ["v4"] }
