name: Verificar segredos

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar Gitleaks com checksum
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/gitleaks_${version}_checksums.txt"
          grep "  $archive$" "gitleaks_${version}_checksums.txt" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm "$archive" "gitleaks_${version}_checksums.txt" gitleaks
      - name: Auditar histórico completo
        run: gitleaks git . --log-opts="--all --full-history" --redact=100 --no-banner
